version: 2

updates:
  # One grouped PR a month (and one for security fixes) instead of one PR per
  # package keeps the repo down to main plus, at most, a couple of open PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A hijacked release is usually caught and pulled within days; waiting a
    # week keeps it out of the PR. Security updates skip the wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # Majors (React 19, a new Vite) need a real migration; without this they
    # arrive as one PR each. Security fixes still do.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Workflows pin every action to a commit SHA; Dependabot moves the SHA and its
  # `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
